name: smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg and Hangul fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install via install.sh (local checkout) and run smoke test
        run: bash install.sh --dir "$RUNNER_TEMP/skill"
      - name: Smoke test (fail the job on errors)
        run: python3 -I "$RUNNER_TEMP/skill/tests/smoke_test.py"
      - name: Agent links with a throwaway HOME
        run: |
          H="$RUNNER_TEMP/home"; mkdir -p "$H/.claude" "$H/.codex"
          HOME="$H" bash install.sh --no-test
          test -f "$H/.agents/skills/unified-video-studio/SKILL.md"
          test -L "$H/.claude/skills/unified-video-studio" && test -f "$H/.claude/skills/unified-video-studio/SKILL.md"
          test -L "$H/.codex/skills/unified-video-studio" && test -f "$H/.codex/skills/unified-video-studio/SKILL.md"
          HOME="$H" bash install.sh --uninstall
          test ! -e "$H/.agents/skills/unified-video-studio" && test ! -e "$H/.claude/skills/unified-video-studio"
      - name: Validate plugin manifests (JSON)
        run: python3 -c "import json;[json.load(open(f)) for f in ('.claude-plugin/plugin.json','.claude-plugin/marketplace.json')]"
